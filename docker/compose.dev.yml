# Local development: PostgreSQL only, published on localhost.
#   docker compose -f docker/compose.dev.yml up -d
# then run the API with `go run ./cmd/server` and the UI with `npm start`.
name: iship-dev

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: iship-dev-postgres
    environment:
      POSTGRES_USER: iship
      POSTGRES_PASSWORD: iship
      POSTGRES_DB: iship
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - iship_dev_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iship -d iship"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  iship_dev_pgdata:
