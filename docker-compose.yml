# Production stack for i-Ship. Joins the VPS's existing Traefik through the
# external "traefik-net" network; PostgreSQL stays on the internal network
# and publishes no host ports.
name: iship

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  APP_PORT: "8080"
  DATABASE_URL: postgres://${POSTGRES_USER:-iship}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@iship-postgres:5432/${POSTGRES_DB:-iship}?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
  JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-168h}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://i-ship.duckdns.org}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  UPLOAD_DIR: /data/uploads
  DB_MAX_CONNS: "10"

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: iship-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-iship}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - iship_pgdata:/var/lib/postgresql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    labels:
      project: iship

  migrate:
    image: iship-api:${IMAGE_TAG:-latest}
    container_name: iship-migrate
    command: ["migrate", "up"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 64m
    networks: [internal]
    labels:
      project: iship

  api:
    image: iship-api:${IMAGE_TAG:-latest}
    container_name: iship-api
    restart: unless-stopped
    command: ["serve"]
    environment: *api-env
    volumes:
      - iship_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    cpus: "0.50"
    networks: [internal, traefik-net]
    labels:
      project: iship
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.iship-api.rule: Host(`${APP_DOMAIN:-i-ship.duckdns.org}`) && PathPrefix(`/api`)
      traefik.http.routers.iship-api.entrypoints: websecure
      traefik.http.routers.iship-api.tls.certresolver: letsencrypt
      traefik.http.routers.iship-api.priority: "100"
      traefik.http.routers.iship-api.middlewares: iship-headers,iship-ratelimit
      traefik.http.services.iship-api.loadbalancer.server.port: "8080"
      traefik.http.services.iship-api.loadbalancer.healthcheck.path: /health
      traefik.http.services.iship-api.loadbalancer.healthcheck.interval: 15s
      traefik.http.middlewares.iship-ratelimit.ratelimit.average: "60"
      traefik.http.middlewares.iship-ratelimit.ratelimit.burst: "120"
      traefik.http.middlewares.iship-ratelimit.ratelimit.period: 1s
      traefik.http.middlewares.iship-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.iship-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.iship-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.iship-headers.headers.frameDeny: "true"
      traefik.http.middlewares.iship-headers.headers.referrerPolicy: strict-origin-when-cross-origin

  web:
    image: iship-web:${IMAGE_TAG:-latest}
    container_name: iship-web
    restart: unless-stopped
    depends_on: [api]
    mem_limit: 32m
    read_only: true
    tmpfs:
      - /tmp
    networks: [traefik-net]
    labels:
      project: iship
      traefik.enable: "true"
      traefik.docker.network: traefik-net
      traefik.http.routers.iship-web.rule: Host(`${APP_DOMAIN:-i-ship.duckdns.org}`)
      traefik.http.routers.iship-web.entrypoints: websecure
      traefik.http.routers.iship-web.tls.certresolver: letsencrypt
      traefik.http.routers.iship-web.priority: "10"
      traefik.http.routers.iship-web.middlewares: iship-headers
      traefik.http.services.iship-web.loadbalancer.server.port: "8080"

networks:
  internal:
    name: iship-internal
    internal: true
  traefik-net:
    external: true

volumes:
  iship_pgdata:
    name: iship_pgdata
  iship_uploads:
    name: iship_uploads
